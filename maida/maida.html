			maimai創作段位リザルトメーカー
			<form onsubmit="return false" name="daninfo">
				段位名:
				<input type="text" name="name" id="daneme">
				初期HP:
				<input type="number" name="inhp" min="0" class="number" id="init_hp"><br>
				減少幅:
				<input type="number" name="perde" min="0" class="number" placeholder="PERFECT" id="d_pe">
				<input type="number" name="perde" min="0" class="number" placeholder="GREAT" id="d_gr">
				<input type="number" name="perde" min="0" class="number" placeholder="GOOD" id="d_go">
				<input type="number" name="perde" min="0" class="number" placeholder="MISS" id="d_mi">
				回復:
				<input type="number" name="perde" min="0" class="number" id="heal">
				<input type="radio" name="tof" value="three" checked>3曲
				<input type="radio" name="tof" value="four">4曲
			</form>
			<hr>

			<form onsubmit="return false" name="chart1">
				1曲目:
				<input type="text" name="name" id="name1">
				<select name="diff" id="diff1">
					<option value="UTAGE">UTAGE</option>
					<option value="BASIC">BASIC</option>
					<option value="ADVANCED">ADVANCED</option>
					<option value="EXPERT">EXPERT</option>
					<option value="MASTER">MASTER</option>
					<option value="ReMASTER">Re:MASTER</option>
				</select>
				<select name="ch_con" id="ch_con1">
					<option value="10">1</option>
					<option value="20">2</option>
					<option value="30">3</option>
					<option value="40">4</option>
					<option value="50">5</option>
					<option value="60">6</option>
					<option value="70">7</option>
					<option value="75">7+</option>
					<option value="80">8</option>
					<option value="85">8+</option>
					<option value="90">9</option>
					<option value="95">9+</option>
					<option value="100">10</option>
					<option value="105">10+</option>
					<option value="110">11</option>
					<option value="115">11+</option>
					<option value="120">12</option>
					<option value="125">12+</option>
					<option value="130">13</option>
					<option value="135">13+</option>
					<option value="140">14</option>
					<option value="145">14+</option>
					<option value="150">15</option>
				</select>
				<input type="radio" name="type1" value="std" checked>STD
				<input type="radio" name="type1" value="dx">DX
				<br>
				達成率:
				<input type="number" step="0.0001" min="0" max="101" id="per1">
				%, 
				DXScore:
				<input type="number" min="0" class="dxscore" id="sc1"><br>
				内訳
				<input type="number" name="perde" min="0" class="number" placeholder="CRITICAL" id="cr1">
				<input type="number" name="perde" min="0" class="number" placeholder="PERFECT" id="pe1">
				<input type="number" name="perde" min="0" class="number" placeholder="GREAT" id="gr1">
